name: Deploy — Ansible Server Provisioning

on:
  # Auto-deploy disabled until SSH keys and secrets are configured
  # push:
  #   branches: [main]
  #   paths:
  #     - "infra/ansible/**"
  #     - "config/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    name: Run Ansible Playbook
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Ansible
        run: pip install ansible

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Generate inventory group_vars
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          HEL_IP: ${{ secrets.HEL_IP }}
          ORC_IP: ${{ secrets.ORC_IP }}
          GCP_IP: ${{ secrets.GCP_IP }}
          SCW_IP: ${{ secrets.SCW_IP }}
        run: node scripts/generate-ansible-inventory.js

      - name: Write SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HEL_SSH_KEY }}" > ~/.ssh/hetzner && chmod 600 ~/.ssh/hetzner
          echo "${{ secrets.ORC_SSH_KEY }}" > ~/.ssh/oracle && chmod 600 ~/.ssh/oracle
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/gcp && chmod 600 ~/.ssh/gcp
          echo "${{ secrets.SCW_SSH_KEY }}" > ~/.ssh/scaleway && chmod 600 ~/.ssh/scaleway

      - name: Run playbook (check mode first)
        env:
          HEL_IP: ${{ secrets.HEL_IP }}
          ORC_IP: ${{ secrets.ORC_IP }}
          GCP_IP: ${{ secrets.GCP_IP }}
          SCW_IP: ${{ secrets.SCW_IP }}
        run: |
          ansible-playbook infra/ansible/playbooks/site.yml \
            -i infra/ansible/inventory/hosts.yml \
            --check --diff

      - name: Run playbook (real)
        env:
          HEL_IP: ${{ secrets.HEL_IP }}
          ORC_IP: ${{ secrets.ORC_IP }}
          GCP_IP: ${{ secrets.GCP_IP }}
          SCW_IP: ${{ secrets.SCW_IP }}
        run: |
          ansible-playbook infra/ansible/playbooks/site.yml \
            -i infra/ansible/inventory/hosts.yml
