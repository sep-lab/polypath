name: Infra — OpenTofu Validate

# PRs get a credential-free syntax/validation pass only.
#
# This repo is a public playbook — it does NOT deploy the maintainer's live
# infrastructure. There is intentionally no credentialed `tofu plan` / apply
# here: `tofu plan` is not read-only (external data sources and provider blocks
# execute at plan time), and plan output would publish production values on a
# public repo. Run plan/apply privately, against your own state and credentials.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "config/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: OpenTofu Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: opentofu/setup-opentofu@v2

      # -backend=false: no remote state, no credentials, nothing to leak.
      - name: Tofu init (no backend)
        working-directory: infra/terraform/environments/production
        run: tofu init -backend=false

      - name: Tofu validate
        working-directory: infra/terraform/environments/production
        run: tofu validate
