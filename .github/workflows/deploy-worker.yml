name: Deploy — Smart-Sub Worker

on:
  # Auto-deploy on push is intentionally disabled for the public repo — deploying
  # live infrastructure is a manual, credentialed action. Trigger by hand instead.
  workflow_call:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency deploy only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deploy_target:
        description: "Deploy target"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "cf-pages"
          - "vercel"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  test-gate:
    name: Pre-deploy Tests
    if: github.event.inputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci --registry https://registry.npmjs.org
      - name: Build worker from src/
        run: npm run build
      - run: npx vitest run --reporter=verbose

  deploy-cf-pages:
    name: Deploy to Cloudflare Pages
    needs: [test-gate]
    if: |
      always() &&
      (needs.test-gate.result == 'success' || needs.test-gate.result == 'skipped') &&
      (github.event.inputs.deploy_target != 'vercel')
    runs-on: ubuntu-latest
    environment:
      name: production-cf
      url: https://sub.example.com
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - run: npm ci --registry https://registry.npmjs.org

      - name: Build worker from src/
        run: npm run build
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Prepare deploy directory
        run: |
          mkdir -p /tmp/vpn-sub-deploy
          cp tools/smart-sub/worker.js /tmp/vpn-sub-deploy/_worker.js

      - name: Deploy to CF Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler pages deploy /tmp/vpn-sub-deploy \
            --project-name your-pages-project \
            --commit-dirty=true \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "deploy: ${GITHUB_SHA::8} — $(git log -1 --pretty=%s)"

      - name: Verify deployment
        run: |
          echo "Waiting 15s for deployment to propagate..."
          sleep 15
          HEALTH=$(curl -sf --max-time 10 https://sub.example.com/health || echo "FAILED")
          if echo "$HEALTH" | grep -q '"status"'; then
            echo "✅ CF Pages deployment verified"
            echo "$HEALTH" | python3 -m json.tool
          else
            echo "⚠️ Health check returned unexpected response (may need more propagation time)"
            echo "$HEALTH"
          fi

      - name: Record deployment
        if: always()
        run: |
          echo "## CF Pages Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${GITHUB_SHA::8}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: https://sub.example.com" >> "$GITHUB_STEP_SUMMARY"

  deploy-vercel:
    name: Deploy Backup to Vercel
    needs: [test-gate]
    if: |
      always() &&
      (needs.test-gate.result == 'success' || needs.test-gate.result == 'skipped') &&
      (github.event.inputs.deploy_target != 'cf-pages')
    runs-on: ubuntu-latest
    environment:
      name: production-vercel
      url: https://sub.example.net
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - run: npm ci --registry https://registry.npmjs.org

      - name: Build worker from src/
        run: npm run build
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Verify backup-sub sync
        run: |
          if diff -q tools/smart-sub/worker.js tools/backup-sub/core-worker.js > /dev/null 2>&1; then
            echo "✅ backup-sub is in sync (build step copies worker.js → core-worker.js)"
          else
            echo "❌ backup-sub out of sync — did npm run build fail?"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: tools/backup-sub
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify deployment
        run: |
          echo "Waiting 10s for deployment to propagate..."
          sleep 10
          HEALTH=$(curl -sf --max-time 10 https://sub.example.net/health || echo "FAILED")
          if echo "$HEALTH" | grep -q '"status"'; then
            echo "✅ Vercel deployment verified"
          else
            echo "⚠️ Health check returned unexpected response"
          fi

      - name: Record deployment
        if: always()
        run: |
          echo "## Vercel Backup Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: \`${GITHUB_SHA::8}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: https://sub.example.net" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Post-deploy Summary
    needs: [deploy-cf-pages, deploy-vercel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          CF_STATUS="${{ needs.deploy-cf-pages.result }}"
          VERCEL_STATUS="${{ needs.deploy-vercel.result }}"

          echo "## Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CF Pages | ${CF_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Vercel | ${VERCEL_STATUS} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CF_STATUS" = "failure" ] || [ "$VERCEL_STATUS" = "failure" ]; then
            echo "::warning::One or more deployments failed — check logs above"
          fi
